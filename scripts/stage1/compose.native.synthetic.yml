# Candidate local-only WP00 v1.15.1 runtime. REQUIRES external Docker host for verification.
# Only synthetic data; do not use real school/student records. Do NOT expose upstream externally.
name: sunrise-s1-native-synthetic
services:
  surrealdb:
    image: surrealdb/surrealdb:v2.3.10
    command: ["start", "--log", "warn", "--user", "${SURREAL_USER:?required}", "--pass", "${SURREAL_PASSWORD:?required}", "rocksdb:/mydata/mydatabase.db"]
    # Dedicated A Gateway connects via loopback only, never public interface.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - surreal_synthetic:/mydata
    networks: [a_private]
    restart: "no"
    security_opt: [no-new-privileges:true]
  open_notebook:
    build:
      context: ${ON_PATCHED_DIR:?absolute path to verified A-only patched staging checkout}
      target: runtime
    image: sunrise-on-s1-v1.15.1-text-only:local
    ports:
      - "127.0.0.1:5055:5055"
    environment:
      OPEN_NOTEBOOK_PASSWORD: ${OPEN_NOTEBOOK_PASSWORD:?required}
      CORS_ORIGINS: http://127.0.0.1:8765
      OPEN_NOTEBOOK_ENCRYPTION_KEY: ${OPEN_NOTEBOOK_ENCRYPTION_KEY:?required}
      SURREAL_URL: ws://surrealdb:8000/rpc
      SURREAL_USER: ${SURREAL_USER:?required}
      SURREAL_PASSWORD: ${SURREAL_PASSWORD:?required}
      SURREAL_NAMESPACE: open_notebook
      SURREAL_DATABASE: open_notebook
      OPEN_NOTEBOOK_ENABLE_DOCLING: "false"
      OPEN_NOTEBOOK_ENABLE_CRAWL4AI: "false"
      OPEN_NOTEBOOK_WORKER_MAX_TASKS: "1"
      OPEN_NOTEBOOK_PASSWORD_FILE: ""
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      NO_PROXY: "localhost,127.0.0.1,surrealdb,open_notebook"
    volumes:
      - notebook_synthetic:/app/data
    depends_on: [surrealdb]
    networks: [a_private]
    restart: "no"
    security_opt: [no-new-privileges:true]
networks:
  a_private:
    internal: true
volumes:
  surreal_synthetic: {}
  notebook_synthetic: {}
