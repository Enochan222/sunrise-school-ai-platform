<!doctype html>
<!-- Sunrise Stage 1 A-only: Codex WP07 scratch candidate port / IMPLEMENTED_UNTESTED -->
<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>教材庫管理 | Sunrise</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/app.js" defer></script>
</head>
<body data-page="admin">
  <a class="skip" href="#main">跳至主要內容</a>
  <header class="masthead"><div class="wrap masthead-inner">
    <p class="brand">Sunrise <span>教材庫</span></p>
    <button id="logout" class="secondary" type="button" hidden>登出</button>
  </div></header>
  <main class="wrap" id="main">
    <h1>教材庫管理</h1>
    <p id="notice" class="notice" role="status" aria-atomic="true">正在核對登入狀態…</p>
    <button id="retry-session" type="button" hidden>重新核對登入狀態</button>
    <a id="sign-in-again" class="button" href="/auth/login" hidden>前往登入</a>
    <div id="workspace" hidden>
      <p>目前學校 <strong id="active-school"></strong></p>
      <div id="pending" class="pending" hidden>
        <p id="pending-message"></p>
        <button id="reconcile" class="secondary" type="button">以原有請求核對結果</button>
      </div>
      <div class="dashboard">
        <div class="sidebar">
          <section class="panel" aria-labelledby="shell-list-title">
            <div class="section-heading">
              <h2 id="shell-list-title">教材容器</h2>
              <button id="refresh-shells" class="secondary" type="button">重新整理</button>
            </div>
            <p id="shell-summary" role="status"></p>
            <label for="filter">篩選已載入的容器</label>
            <input id="filter" type="search" placeholder="學年、年級、科目或課程類別">
            <ul id="shells" class="shells" aria-label="教材容器列表"></ul>
          </section>
          <section class="panel" aria-labelledby="create-title">
            <h2 id="create-title">新增教材容器</h2>
            <p class="help">學校沿用目前登入的學校。建立容器時，系統會配對一個專用 Notebook。</p>
            <form id="create">
              <label for="year">學年</label><input id="year" name="academic_year" required maxlength="32" placeholder="例如 2026-2027">
              <label for="grade">年級</label><input id="grade" name="grade" required maxlength="32">
              <label for="subject">科目</label><input id="subject" name="subject" required maxlength="48">
              <label for="stream">課程類別</label><input id="stream" name="curriculum_stream" required maxlength="48">
              <button id="create-submit" type="submit">建立教材容器</button>
            </form>
          </section>
        </div>
        <div class="content">
          <p id="detail-status" class="notice" role="status">請先選擇教材容器。</p>
          <button id="retry-detail" class="secondary" type="button" hidden>重新載入容器詳情</button>
          <section id="detail" class="panel" aria-labelledby="detail-title" hidden>
            <div class="section-heading">
              <h2 id="detail-title" tabindex="-1"></h2>
              <button id="archive" class="secondary" type="button">封存容器</button>
            </div>
            <p id="archive-note" hidden>此容器已封存。你仍可查閱、搜尋和下載獲授權的材料。</p>
            <dl id="shell-meta" class="metadata"></dl>
            <form id="upload">
              <h3>上載 PDF</h3>
              <p class="help">請選用包含文字的合成測試 PDF，並填寫授權及保留資料。</p>
              <label for="file">原始 PDF</label><input id="file" name="file" type="file" accept="application/pdf,.pdf" required>
              <label for="material-title">教材標題</label><input id="material-title" name="title" required maxlength="200">
              <label for="license">授權資料</label><input id="license" name="license" required maxlength="120">
              <label for="retention">保留資料</label><input id="retention" name="retention" required maxlength="100">
              <button id="upload-submit" type="submit">上載 PDF</button>
            </form>
            <p id="upload-receipt" class="notice" role="status" hidden></p>
            <section aria-labelledby="materials-title">
              <div class="section-heading">
                <h3 id="materials-title">材料</h3>
                <button id="refresh-materials" class="secondary" type="button">更新材料列表</button>
              </div>
              <p id="materials-status" role="status"></p>
              <ul id="materials" class="cards" aria-label="材料列表"></ul>
            </section>
            <section aria-labelledby="search-title">
              <h3 id="search-title">搜尋容器內的教材</h3>
              <form id="search" class="search-form">
                <div><label for="query">文字關鍵字</label><input id="query" name="query" type="search" required maxlength="300"></div>
                <button id="search-submit" type="submit">搜尋</button>
              </form>
              <p id="search-status" role="status"></p>
              <ul id="search-results" class="cards" aria-label="搜尋結果"></ul>
            </section>
          </section>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
