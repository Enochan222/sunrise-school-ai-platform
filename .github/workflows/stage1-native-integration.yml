name: Stage 1 A - Manual Native Integration
on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Exact reviewed Stage 1 A source commit (40 lowercase hex)'
        type: string
        required: true
      surreal_digest:
        description: 'Approved SurrealDB v2.3.10 registry digest (64 lowercase hex, without sha256:)'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: stage1-native-${{ inputs.target_ref }}
  cancel-in-progress: false
jobs:
  native:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Validate manually selected source and immutable image digest
        shell: bash
        env:
          TARGET_REF: ${{ inputs.target_ref }}
          SURREAL_DIGEST: ${{ inputs.surreal_digest }}
        run: |
          set -Eeuo pipefail
          [[ "$TARGET_REF" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid 40-hex reviewed source SHA'; exit 2; }
          [[ "$SURREAL_DIGEST" =~ ^[0-9a-f]{64}$ ]] || { echo 'Invalid 64-hex approved SurrealDB digest'; exit 2; }
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'Manual dispatch must originate on main'; exit 2; }
          echo "DISPATCH_SHA=$GITHUB_SHA TARGET_REF=$TARGET_REF UTC=$(date -u +%FT%TZ)"
      - name: Checkout exact reviewed source, not floating PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # reviewed v4.2.2
        with:
          ref: ${{ inputs.target_ref }}
          persist-credentials: false
      - name: Python 3.12 synthetic test driver
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # reviewed v5.6.0
        with:
          python-version: '3.12'
      - name: Pinned dual-physical-DB native bootstrap and bounded smoke (NOT formal AT)
        shell: bash
        env:
          TARGET_REF: ${{ inputs.target_ref }}
          SURREAL_DIGEST: ${{ inputs.surreal_digest }}
        run: |
          set -Eeuo pipefail
          [[ "$TARGET_REF" =~ ^[0-9a-f]{40}$ && "$SURREAL_DIGEST" =~ ^[0-9a-f]{64}$ ]] || exit 2
          [[ "$(git rev-parse HEAD)" == "$TARGET_REF" ]] || { echo 'Target source SHA mismatch'; exit 2; }
          test -f scripts/stage1/native_runtime_prepare.sh || { echo 'Dual-DB bootstrap absent at requested SHA'; exit 2; }
          test -f scripts/stage1/compose.native.synthetic.yml || exit 2
          test -f scripts/stage1/loopback_port_contract.py || exit 2
          test -f scripts/stage1/native_runtime_smoke.py || exit 2
          test -f scripts/stage1/verify_surreal_image_user.py || exit 2
          SOURCE_TREE="$(git rev-parse HEAD^{tree})"
          echo "TESTED_SHA=$TARGET_REF TESTED_TREE=$SOURCE_TREE"
          # Only synthetic credentials. They remain in this step's process environment.
          secret() { python -c 'import secrets;print(secrets.token_urlsafe(48))'; }
          export A_SURREAL_USER=stage1_a_ci A_SURREAL_PASSWORD="$(secret)"
          export A_SURREAL_NAMESPACE=stage1_a A_SURREAL_DATABASE=journal_ci
          export ON_SURREAL_USER=stage1_on_ci ON_SURREAL_PASSWORD="$(secret)"
          export ON_GRAPH_NAMESPACE=stage1_on ON_GRAPH_DATABASE=notebooks_ci
          export ON_GRAPH_VIEWER_USER=stage1_viewer ON_GRAPH_VIEWER_PASSWORD="$(secret)"
          export OPEN_NOTEBOOK_PASSWORD="$(secret)" OPEN_NOTEBOOK_ENCRYPTION_KEY="$(secret)"
          for name in A_SURREAL_PASSWORD ON_SURREAL_PASSWORD ON_GRAPH_VIEWER_PASSWORD OPEN_NOTEBOOK_PASSWORD OPEN_NOTEBOOK_ENCRYPTION_KEY; do
            echo "::add-mask::${!name}"
          done
          export VAULT_RUNTIME_SYNTHETIC_CONFIRM=YES VAULT_EXCLUSIVE_SYNTHETIC_PROJECT=YES
          export VAULT_DOCKER_CONTEXT=default
          export VAULT_SYNTHETIC_PROJECT="sunrise-s1-gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export VAULT_SURREAL_IMAGE_DIGEST="sha256:$SURREAL_DIGEST"
          export ON_SOURCE_DIR="$RUNNER_TEMP/on-upstream-pinned"
          export ON_PATCHED_DIR="$RUNNER_TEMP/on-patched-fresh"
          # This synthetic CORS origin / CA satisfies bootstrap configuration only.
          # No TLS Gateway is started or counted as an acceptance PASS here.
          export VAULT_GATEWAY_ORIGIN=https://127.0.0.1:9443
          export VAULT_GATEWAY_CA_FILE="$RUNNER_TEMP/synthetic-gateway-ca.pem"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=Sunrise CI Synthetic CA' \
            -keyout "$RUNNER_TEMP/synthetic-gateway-ca-key.pem" \
            -out "$VAULT_GATEWAY_CA_FILE" >/dev/null 2>&1
          # Choose three distinct ephemeral loopback ports. A later Docker bind
          # conflict fails closed; this does not claim a reserved-port lease.
          read -r VAULT_A_RELAY_PORT VAULT_ON_RELAY_PORT VAULT_NATIVE_RELAY_PORT < <(
            python - <<'PY_PORTS'
          import socket
          ports=[]
          for _ in range(3):
              for attempt in range(30):
                  with socket.socket(socket.AF_INET,socket.SOCK_STREAM) as s:
                      s.bind(('127.0.0.1',0))
                      port=s.getsockname()[1]
                  if port not in ports:
                      ports.append(port)
                      break
              else:
                  raise SystemExit('Unable to obtain three distinct loopback ports')
          print(*ports)
          PY_PORTS
          )
          export VAULT_A_RELAY_PORT VAULT_ON_RELAY_PORT VAULT_NATIVE_RELAY_PORT
          python -m pip install --disable-pip-version-check -r apps/a-vault/requirements-dev.txt
          git clone --quiet https://github.com/lfnovo/open-notebook.git "$ON_SOURCE_DIR"
          git -C "$ON_SOURCE_DIR" checkout --quiet --detach 5e285b7a2e435895c4ee99ad7e4b8d2af64c3239
          [[ "$(git -C "$ON_SOURCE_DIR" rev-parse HEAD)" == 5e285b7a2e435895c4ee99ad7e4b8d2af64c3239 ]] || exit 2
          [[ "$(git -C "$ON_SOURCE_DIR" rev-parse HEAD^{tree})" == 2d101001de594c7d6a0e4aaeb8e85ac4c52980af ]] || exit 2
          [[ -z "$(git -C "$ON_SOURCE_DIR" status --porcelain)" ]] || exit 2
          docker pull surrealdb/surrealdb:v2.3.10
          docker image inspect surrealdb/surrealdb:v2.3.10 \
            --format '{{json .RepoDigests}}' | grep -F "@sha256:$SURREAL_DIGEST" >/dev/null || {
              echo 'SurrealDB v2.3.10 tag does not match approved immutable registry digest'; exit 2;
            }
          docker run --rm --network none surrealdb/surrealdb:v2.3.10 version | grep -F '2.3.10'
          # Resolve the verified image identity in the caller shell.
          # Bootstrap exports stay in its child; relay checks also need these values.
          SURREAL_IMAGE_ID="$(docker --context "$VAULT_DOCKER_CONTEXT" image inspect surrealdb/surrealdb:v2.3.10 --format '{{.Id}}')"
          VERIFIED_IMAGE_USER="$(python scripts/stage1/verify_surreal_image_user.py \
            --context "$VAULT_DOCKER_CONTEXT" --image "$SURREAL_IMAGE_ID" \
            --digest "$VAULT_SURREAL_IMAGE_DIGEST")"
          [[ "$VERIFIED_IMAGE_USER" =~ ^[1-9][0-9]*:[1-9][0-9]*$ ]] || exit 78
          IMAGE_UID="${VERIFIED_IMAGE_USER%%:*}"; IMAGE_GID="${VERIFIED_IMAGE_USER##*:}"
          (( IMAGE_UID <= 65534 && IMAGE_GID <= 65534 )) || exit 78
          export A_SURREAL_IMAGE_UID="$IMAGE_UID" A_SURREAL_IMAGE_GID="$IMAGE_GID"
          export ON_SURREAL_IMAGE_UID="$IMAGE_UID" ON_SURREAL_IMAGE_GID="$IMAGE_GID"
          # Canonical PR14 dual-DB bootstrap: separate A/ON networks and volumes;
          # only no-secret relay services may bind 127.0.0.1 host ports.
          bash scripts/stage1/native_runtime_prepare.sh
          for service in a_db on_db native; do
            python scripts/stage1/loopback_port_contract.py \
              --context "$VAULT_DOCKER_CONTEXT" --project "$VAULT_SYNTHETIC_PROJECT" \
              --compose-file scripts/stage1/compose.native.synthetic.yml --service "$service" \
              > "$RUNNER_TEMP/relay-$service-redacted.json"
          done
          NATIVE_PORT="$(python -c 'import json,sys;print(json.load(open(sys.argv[1]))["port"])' "$RUNNER_TEMP/relay-native-redacted.json")"
          [[ "$NATIVE_PORT" =~ ^[0-9]{4,5}$ ]] || exit 2
          READY=NO
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 3 "http://127.0.0.1:$NATIVE_PORT/health" >/dev/null; then
              READY=YES; break
            fi
            sleep 2
          done
          [[ "$READY" == YES ]] || { echo 'Pinned Native API did not become healthy'; exit 1; }
          python scripts/stage1/native_runtime_smoke.py \
            --host "http://127.0.0.1:$NATIVE_PORT" \
            --out "$RUNNER_TEMP/native-runtime-redacted.json"
          python - "$RUNNER_TEMP/native-runtime-redacted.json" <<'PY_REPORT'
          import json,sys
          report=json.load(open(sys.argv[1],encoding='utf-8'))
          required={'notebook_create','pdf_submit_embed_off','native_worker_pdf_extraction',
                    'original_hash','scoped_bm25','traditional_chinese_scoped_text_search',
                    'traditional_chinese_foreign_notebook_denial'}
          checks=report.get('runtime_tests',{})
          if report.get('status')!='PASS' or any(checks.get(k)!='PASS' for k in required):
              raise SystemExit('Real pinned Native PDF/Worker/Search smoke failed')
          print('DUAL_DB_BOOTSTRAP_AND_NATIVE_SMOKE=PASS')
          print('FORMAL_S1_AT01_15=NOT_RUN')
          print('GATEWAY_TLS_AND_EXTERNAL_OBSERVER=NOT_RUN')
          print('WP03_AT06_JOURNAL_ACK_LOSS=NOT_RUN')
          print('COLD_RESTORE_AND_OWNER_UAT=NOT_RUN')
          PY_REPORT
          sha256sum "$RUNNER_TEMP/native-runtime-redacted.json" "$RUNNER_TEMP"/relay-*-redacted.json
          # No automated volume deletion/prune: this is an ephemeral hosted runner.
