name: Stage 1 A - Light Unit and Component
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'apps/a-vault/**'
      - 'tests/stage1/**'
      - 'scripts/stage1/**'
permissions:
  contents: read
concurrency:
  group: stage1-light-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  stage1-light:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout PR merge commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # reviewed tag v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # reviewed tag v5.6.0
        with:
          python-version: '3.12'
      - name: Record tested revision
        run: git log -1 --format=%H
      - name: Install pinned Stage 1 test requirements
        run: python -m pip install --disable-pip-version-check -r apps/a-vault/requirements-dev.txt
      - name: Compile Stage 1 Python files
        run: python -m compileall -q apps/a-vault scripts/stage1 tests/stage1
      - name: Check Admin JavaScript syntax
        run: node --check apps/a-vault/ui.js
      - name: Stage 1 unit/component/negative tests (NOT native runtime)
        env:
          PYTHONPATH: apps/a-vault
        run: python -m pytest -q tests/stage1
