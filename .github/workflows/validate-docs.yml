name: Sunrise Stage 0 Verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sunrise-stage0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-docs:
    name: validate-docs
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout PR safely
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install future Master Kit dependency
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.23.0'
      - name: Run positive and negative local invariant tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify bootstrap or full Master Kit transition
        run: python scripts/validate_stage0.py
